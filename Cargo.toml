[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
agent-client-protocol = "2.1.0"
async-trait = "0.1"
blake3 = "1"
dirs = "6"
dunce = "1"
futures = "0.3"
imara-diff = "0.2"
mime_guess = "2"
parking_lot = "0.12"
portable-pty = "0.9"
process-wrap = { version = "10", features = ["tokio1"] }
proptest = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive", "collect"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
tauri = { version = "2.8.5" }
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
anyhow = "1"
tempfile = "3"
bzip2 = "0.4"

# Wave 2 (M1.6d). Declared here so every worktree resolves one version; the
# consuming crates reference these as `workspace = true` when their code lands.
# `zip`, `tar`, `flate2` and `reqwest` are already used by `tethys-sync` at the
# same versions. `keyring` is deliberately *not* promoted: it stays a
# `tethys-sync` local dependency until a second crate needs it (plan U4).
sysinfo = "0.39"
which = "8"
semver = "1"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
wiremock = "0.6"
