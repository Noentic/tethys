[package]
name = "tethys-sync"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["github"]
github = ["dep:reqwest"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml_edit = "0.25"
thiserror.workspace = true
blake3.workspace = true
imara-diff.workspace = true
tempfile.workspace = true
jsonc-parser = { version = "0.33.2", features = ["cst", "serde_json"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "blocking"], optional = true }
tethys-schema = { path = "../tethys-schema" }
tethys-store = { path = "../tethys-store" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
